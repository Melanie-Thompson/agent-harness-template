[project]
name = "tda-harness"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "redis[hiredis]>=5.2",
    "python-dotenv>=1.0",
    "motor>=3.6",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "resend>=2.0",
    "httpx>=0.27",
    "pydantic[email]>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
