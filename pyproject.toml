[project]
name = "agent-harness-template"
version = "0.1.0"
description = "AI agent harness with tool-calling, SSE streaming, guardrails, and gated writes"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "redis[hiredis]>=5.2",
    "python-dotenv>=1.0",
    "motor>=3.6",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "resend>=2.0",
    "httpx>=0.27",
    "pydantic[email]>=2.0",
    "langchain-core>=1.7.0",
    "langchain-anthropic>=1.7.6",
    "langchain-openai>=1.7.2",
    "langchain-google-genai>=4.4.2",
    "langchain-mcp-adapters>=0.3.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["ai", "auth", "db", "models", "routes", "schemas", "config", "main"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "if __name__",
    "pragma: no cover",
]
